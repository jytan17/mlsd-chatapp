<!doctype html>
<meta charset="utf-8">
<title>chat test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 1rem auto; padding: 0 1rem; }
  input, select { font: inherit; padding: 6px 8px; margin: 2px; border-radius: 6px; }
  pre { padding: 8px; border-radius: 6px; overflow: auto; max-height: 50vh; }

  button {
    font: inherit; font-weight: 600; padding: 8px 16px; margin: 3px;
    border: none; border-radius: 6px; cursor: pointer;
    background: #2563eb; color: #fff;
  }
  button:hover { background: #1d4ed8; }
  button:active { transform: translateY(1px); }
  /* secondary (non-primary) actions */
  button.secondary { background: #64748b; }
  button.secondary:hover { background: #475569; }

  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #d7dae0; }
    input, select { background: #23262e; color: #d7dae0; border: 1px solid #3a3f4b; }
    pre { background: #0f1115; border: 1px solid #2a2e37; }
    h3 { color: #9aa4b2; }
  }
  @media (prefers-color-scheme: light) {
    pre { background: #f4f5f7; border: 1px solid #ddd; }
    input, select { border: 1px solid #ccc; }
  }
</style>
<body>
  <h3>login</h3>
  <select id="user">
    <option value="bob">bob</option>
    <option value="carol">carol</option>
  </select>
  <input id="pass" type="password" value="password">
  <button onclick="login()">login + connect WS</button>
  <div id="who"></div>
  <div id="wsstate">ws: closed</div>

  <h3>conversation</h3>
  <select id="conv"></select>
  <button class="secondary" onclick="loadConvs()">refresh convs</button>
  <button class="secondary" onclick="loadMsgs()">load history</button>
  <button class="secondary" onclick="markRead()">mark read</button>
  <div id="seen">last seen: —</div>

  <h3>send (over WS)</h3>
  <input id="body" placeholder="message">
  <button onclick="send()">send</button>

  <h3>live log</h3>
  <pre id="log"></pre>

<script>
let token = null;
let ws = null;
let lastSeenId = null;   // newest message id this client has seen

function setSeen(id) { lastSeenId = id; seen.textContent = 'last seen: ' + id; }

function logline(s) {
  log.textContent = new Date().toLocaleTimeString() + '  ' + s + '\n' + log.textContent;
}

async function login() {
  const r = await fetch('/login', {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({username: user.value, password: pass.value})});
  const j = await r.json();
  token = j.token;
  const me = await (await fetch('/me', {headers:{authorization:'Bearer '+token}})).json();
  who.textContent = 'logged in as ' + me.username + ' (' + me.id + ')';
  await loadConvs();
  connectWs();
}

function connectWs() {
  if (ws) ws.close();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws?token=' + token);
  ws.onopen = () => wsstate.textContent = 'ws: open';
  ws.onclose = () => wsstate.textContent = 'ws: closed';
  ws.onerror = () => wsstate.textContent = 'ws: error';
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'new_message') {
      const m = ev.data;
      setSeen(m.id);
      logline('MSG [' + m.sender_id.slice(0,8) + '] ' + m.body);
    } else {
      logline(e.data);
    }
  };
}

async function loadConvs() {
  const r = await fetch('/conversations', {headers:{authorization:'Bearer '+token}});
  const j = await r.json();
  conv.innerHTML = '';
  for (const c of j) {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.id;
    conv.appendChild(o);
  }
}

async function loadMsgs() {
  const r = await fetch('/conversations/' + conv.value + '/messages',
    {headers:{authorization:'Bearer '+token}});
  const j = await r.json();
  // default list is newest-first, so messages[0] is the latest
  if (j.messages.length) setSeen(j.messages[0].id);
  for (const m of j.messages.slice().reverse()) {
    logline('HIST [' + m.sender_id.slice(0,8) + '] ' + m.body);
  }
}

async function markRead() {
  if (!lastSeenId) { logline('nothing seen yet'); return; }
  const r = await fetch('/conversations/' + conv.value + '/read',
    {method:'POST', headers:{'content-type':'application/json', authorization:'Bearer '+token},
     body: JSON.stringify({message_id: lastSeenId})});
  logline('mark read (' + lastSeenId.slice(0,8) + ') → ' + r.status);
}

function send() {
  if (!ws || ws.readyState !== 1) { logline('ws not open'); return; }
  ws.send(JSON.stringify({type:'send_message', data:{conversation_id: conv.value, body: body.value}}));
  body.value = '';
}
</script>

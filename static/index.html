<!doctype html>
<meta charset="utf-8">
<title>chat test</title>
<style>
  :root { --bg:#fff; --fg:#1a1d23; --muted:#64748b; --panel:#f4f5f7; --border:#ddd;
          --me:#2563eb; --meFg:#fff; --them:#e5e7eb; --themFg:#1a1d23; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#d7dae0; --muted:#8b93a1; --panel:#1c1f26; --border:#2a2e37;
            --me:#2563eb; --meFg:#fff; --them:#2a2f3a; --themFg:#d7dae0; }
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 1rem;
         background: var(--bg); color: var(--fg); }
  h3 { color: var(--muted); margin: 1rem 0 .4rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  input, select { font: inherit; padding: 7px 9px; margin: 2px; border-radius: 7px;
                  background: var(--panel); color: var(--fg); border: 1px solid var(--border); }
  button { font: inherit; font-weight: 600; padding: 8px 14px; margin: 2px; border: none;
           border-radius: 7px; cursor: pointer; background: var(--me); color: #fff; }
  button:hover { filter: brightness(1.1); }
  button:active { transform: translateY(1px); }
  button.secondary { background: var(--muted); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .pill { font-size: .8rem; color: var(--muted); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#94a3b8; margin-right:4px; }
  .dot.on { background:#22c55e; }
  code { background: var(--panel); padding: 2px 6px; border-radius: 5px; cursor: pointer; border:1px solid var(--border); }

  #chat { height: 46vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px;
          padding: 10px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 75%; padding: 7px 11px; border-radius: 13px; line-height: 1.3; word-wrap: break-word; }
  .msg.me   { align-self: flex-end;   background: var(--me);   color: var(--meFg); border-bottom-right-radius: 4px; }
  .msg.them { align-self: flex-start; background: var(--them); color: var(--themFg); border-bottom-left-radius: 4px; }
  .msg .who { font-size: .68rem; opacity: .7; margin-bottom: 2px; }
  #typing { height: 1.2em; color: var(--muted); font-style: italic; font-size: .85rem; padding: 2px 4px; }
  #log { font-size: .72rem; color: var(--muted); max-height: 22vh; overflow: auto;
         background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
         white-space: pre-wrap; }
  details summary { cursor: pointer; color: var(--muted); font-size: .8rem; }
</style>
<body>

  <h3>account</h3>
  <div class="row">
    <input id="user" placeholder="username" value="alice">
    <input id="pass" type="password" placeholder="password" value="password123">
    <button class="secondary" onclick="signup()">sign up</button>
    <button onclick="login()">log in</button>
  </div>
  <div class="row" style="margin-top:6px">
    <span id="who" class="pill">not logged in</span>
    <span id="myid" class="pill"></span>
  </div>
  <div class="row"><span id="wsstate" class="pill"><span class="dot"></span>ws: closed</span></div>

  <h3>start a conversation</h3>
  <div class="row">
    <input id="peer" placeholder="peer user id (paste theirs)" size="38">
    <button onclick="createDm()">create DM</button>
  </div>

  <h3>conversation</h3>
  <div class="row">
    <select id="conv" onchange="selectConv()"></select>
    <button class="secondary" onclick="loadConvs()">refresh</button>
    <span id="peerpresence" class="pill"></span>
  </div>

  <h3>chat</h3>
  <div id="chat"></div>
  <div id="typing"></div>
  <div class="row">
    <input id="body" placeholder="type a message…" style="flex:1" autocomplete="off">
    <input id="file" type="file" accept="image/*">
    <button onclick="send()">send</button>
  </div>

  <h3>debug</h3>
  <details><summary>raw event log</summary><pre id="log"></pre></details>

<script>
let token = null, myId = null, ws = null;
let curConv = null;
let byConv = {};          // conv_id -> [messages]  (client cache, deduped)
let seenIds = new Set();  // idempotency: dedup by message id

function logline(s) { log.textContent = new Date().toLocaleTimeString() + '  ' + s + '\n' + log.textContent; }
function api(path, opts={}) {
  opts.headers = Object.assign({'content-type':'application/json'}, opts.headers||{},
    token ? {authorization:'Bearer '+token} : {});
  return fetch(path, opts);
}

async function signup() {
  const r = await api('/signup', {method:'POST', body: JSON.stringify({username:user.value, password:pass.value})});
  logline('signup ' + user.value + ' → ' + r.status + (r.ok ? '' : ' (' + await r.text() + ')'));
}

async function login() {
  const r = await api('/login', {method:'POST', body: JSON.stringify({username:user.value, password:pass.value})});
  if (!r.ok) { logline('login failed → ' + r.status); return; }
  token = (await r.json()).token;
  const me = await (await api('/me')).json();
  myId = me.id;
  who.textContent = 'logged in as ' + me.username;
  myid.innerHTML = 'your id: <code onclick="copy(this)" title="click to copy">' + me.id + '</code>';
  await loadConvs();
  connectWs();
}

function copy(el) { navigator.clipboard.writeText(el.textContent); el.style.opacity=.5; setTimeout(()=>el.style.opacity=1,200); }

function connectWs() {
  if (ws) ws.close();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws?token=' + token);
  ws.onopen  = () => setWs(true);
  ws.onclose = () => { setWs(false); if (token) setTimeout(connectWs, 1500); }; // auto-reconnect
  ws.onerror = () => setWs(false);
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'hello')            { setWs(true, ev.data.pod); logline('connected to pod ' + ev.data.pod); }
    else if (ev.type === 'new_message') onMessage(ev.data);
    else if (ev.type === 'typing')      { if (ev.data.conversation_id === curConv) showTyping(ev.data.user_id); }
    else if (ev.type === 'read')        logline('✓✓ ' + short(ev.data.user_id) + ' read up to ' + short(ev.data.last_read_message_id));
    else                                logline(e.data);
  };
}
let podName = '?';
function setWs(on, pod) {
  if (pod) podName = pod;
  wsstate.innerHTML = '<span class="dot ' + (on?'on':'') + '"></span>ws: ' + (on?'open':'closed') +
                      (on ? ' · pod ' + podName : '');
}

function short(id) { return id.slice(0,8); }

function onMessage(m) {
  if (seenIds.has(m.id)) return;          // dedup (idempotency via stable id)
  seenIds.add(m.id);
  (byConv[m.conversation_id] ||= []).push(m);
  if (m.conversation_id === curConv) { renderMsg(m, true); markRead(m.id); }
  else logline('MSG in other conv ' + short(m.conversation_id));
}

async function loadConvs() {
  const j = await (await api('/conversations')).json();
  conv.innerHTML = '';
  for (const c of j) {
    const peer = (c.member_ids || []).filter(x => x !== myId)[0] || 'self';
    const o = document.createElement('option');
    o.value = c.id; o.textContent = 'DM · ' + short(peer) + '  (' + short(c.id) + ')';
    conv.appendChild(o);
  }
  if (j.length && !curConv) selectConv();
}

async function createDm() {
  if (!peer.value.trim()) { logline('paste a peer id first'); return; }
  const r = await api('/conversations', {method:'POST',
    body: JSON.stringify({kind:'dm', member_ids:[peer.value.trim()]})});
  const t = await r.text();
  logline('create DM → ' + r.status + ' ' + t);
  if (r.ok) { await loadConvs(); const c = JSON.parse(t); conv.value = c.id; selectConv(); }
}

async function selectConv() {
  curConv = conv.value;
  if (!curConv) return;
  chat.innerHTML = '';
  typing.textContent = '';
  const j = await (await api('/conversations/' + curConv + '/messages')).json();
  const msgs = j.messages.slice().reverse();  // API newest-first → show oldest-first
  byConv[curConv] = msgs;
  for (const m of msgs) { seenIds.add(m.id); renderMsg(m, false); }
  chat.scrollTop = chat.scrollHeight;
  const last = msgs[msgs.length-1];
  if (last) markRead(last.id);
  checkPresence();
}

function renderMsg(m, scroll) {
  const div = document.createElement('div');
  const mine = m.sender_id === myId;
  div.className = 'msg ' + (mine ? 'me' : 'them');
  div.innerHTML = (mine ? '' : '<div class="who">' + short(m.sender_id) + '</div>') + escapeHtml(m.body);
  if (m.media_id) loadMedia(div, m.media_id);
  chat.appendChild(div);
  if (scroll) chat.scrollTop = chat.scrollHeight;
}
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function loadMedia(div, media_id) {
  try {
    const j = await (await api('/media/' + media_id + '/url')).json();  // presigned GET
    const img = document.createElement('img');
    img.src = j.url;                       // browser fetches bytes direct from MinIO
    img.style.cssText = 'max-width:220px; border-radius:9px; display:block; margin-top:5px';
    div.appendChild(img);
    chat.scrollTop = chat.scrollHeight;
  } catch { logline('media load failed ' + short(media_id)); }
}

async function uploadFile(f) {
  // 1. ask server for a presigned PUT url (+ records media row)
  const r = await api('/media/upload-url', {method:'POST', body: JSON.stringify({content_type: f.type || 'application/octet-stream'})});
  if (!r.ok) { logline('upload-url failed ' + r.status); return null; }
  const { media_id, upload_url } = await r.json();
  // 2. PUT bytes DIRECT to MinIO (content-type must match the signed one)
  const put = await fetch(upload_url, {method:'PUT', headers:{'content-type': f.type || 'application/octet-stream'}, body: f});
  if (!put.ok) { logline('PUT to minio failed ' + put.status); return null; }
  return media_id;
}

async function send() {
  if (!ws || ws.readyState !== 1) { logline('ws not open'); return; }
  if (!curConv) { logline('pick a conversation'); return; }
  const f = file.files[0];
  let media_id = null;
  if (f) { media_id = await uploadFile(f); if (!media_id) return; }
  const text = body.value.trim() || (f ? f.name : '');
  if (!text) return;   // server rejects empty body → caption defaults to filename
  ws.send(JSON.stringify({type:'send_message', data:{conversation_id: curConv, body: text, media_id}}));
  body.value = ''; file.value = '';
}
body.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function markRead(id) {
  if (!curConv) return;
  await api('/conversations/' + curConv + '/read', {method:'POST', body: JSON.stringify({message_id: id})});
}

// ---- typing ----
let lastTypingSent = 0, typingTimer = null;
body.addEventListener('input', () => {
  if (!ws || ws.readyState !== 1 || !curConv) return;
  const now = Date.now();
  if (now - lastTypingSent < 3000) return;   // throttle 1 frame / 3s
  lastTypingSent = now;
  ws.send(JSON.stringify({type:'typing', data:{conversation_id: curConv}}));
});
function showTyping(uid) {
  typing.textContent = short(uid) + ' is typing…';
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => typing.textContent = '', 5000);  // server sends no "stop"
}

// ---- presence of the peer in current conv ----
async function checkPresence() {
  const c = [...conv.options].find(o => o.value === curConv);
  const cache = byConv[curConv] || [];
  const peerId = cache.map(m=>m.sender_id).find(x=>x!==myId);
  if (!peerId) { peerpresence.textContent = ''; return; }
  try {
    const p = await (await api('/presence/' + peerId)).json();
    peerpresence.innerHTML = '<span class="dot ' + (p.online?'on':'') + '"></span>' + (p.online?'online':'offline');
  } catch { peerpresence.textContent = ''; }
}
setInterval(() => { if (curConv) checkPresence(); }, 10000);
</script>

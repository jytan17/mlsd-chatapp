apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-config
data:
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  PORT: "3000"
---
apiVersion: v1
kind: Secret
metadata:
  name: chat-secret
type: Opaque
stringData:
  DATABASE_URL: postgres://chat:chat@postgres:5432/chat
  REDIS_URL: redis://redis:6379
  S3_ACCESS_KEY: chat
  S3_SECRET_KEY: chatchat123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
spec:
  replicas: 5
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: chatapp:v3
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: chat-config
            - secretRef:
                name: chat-secret
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chat
spec:
  selector:
    app: chat
  ports:
    - port: 3000
      targetPort: 3000
